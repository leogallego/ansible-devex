name: Deploy deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'open-slide/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-slide/package-lock.json

      - name: Install dependencies
        working-directory: open-slide
        run: npm ci

      - name: Build
        working-directory: open-slide
        env:
          OPEN_SLIDE_BASE: /ansible-devex/
        run: npm run build

      - name: SPA fallback for client-side routing
        working-directory: open-slide
        run: cp dist/index.html dist/404.html

      - name: Redirect root to presentation
        working-directory: open-slide
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=s/ansible-devex"><link rel="canonical" href="s/ansible-devex"></head></html>' > dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: open-slide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
